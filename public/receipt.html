<!DOCTYPE html>
<html lang="th">
<!--
  ไฟล์นี้ทำหน้าที่: หน้าแสดงใบเสร็จของบิลขาย (สำหรับดูและพิมพ์)
  อ่านเลขที่บิลจาก URL แล้วดึงข้อมูลมาแสดง ดูตรรกะได้ที่ js/receipt.js
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini POS">
<meta name="theme-color" content="#1c1b1a">
<title>ใบเสร็จ · Mini POS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/receipt.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pos-theme') || 'light');</script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="toolbar no-print">
  <button class="btn btn-ghost" id="backBtn">← กลับ</button>
  <button class="btn btn-primary" id="printBtn">พิมพ์ใบเสร็จ</button>
</div>

<div id="receiptRoot" class="receipt-wrap">
  <p class="loading no-print">กำลังโหลด...</p>
</div>

<script src="js/api.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
