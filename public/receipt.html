<!DOCTYPE html>
<html lang="th">
<!--
  ไฟล์นี้ทำหน้าที่: หน้าแสดงใบเสร็จของบิลขาย (สำหรับดูและพิมพ์)
  อ่านเลขที่บิลจาก URL แล้วดึงข้อมูลมาแสดง ดูตรรกะได้ที่ js/receipt.js
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini POS">
<meta name="theme-color" content="#1c1b1a">
<title>ใบเสร็จ · Mini POS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/receipt.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pos-theme') || 'light');</script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="toolbar no-print">
  <button class="btn btn-ghost" id="backBtn">← กลับ</button>
  <button class="btn btn-ghost" id="printBluetoothBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v5"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg><span id="printBluetoothLabel">พิมพ์ผ่านเครื่องพิมพ์</span></button>
  <button class="btn btn-primary" id="printBtn">พิมพ์ใบเสร็จ</button>
</div>

<div id="receiptRoot" class="receipt-wrap">
  <p class="loading no-print">กำลังโหลด...</p>
</div>

<script src="js/api.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
