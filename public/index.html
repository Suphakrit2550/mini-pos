<!DOCTYPE html>
<html lang="th">
<!--
  ไฟล์นี้ทำหน้าที่: หน้าขายหน้าร้าน (POS) — หน้าแรกของระบบ
  ใช้สำหรับเลือกสินค้าใส่ตะกร้าและทำรายการขาย ดูตรรกะได้ที่ js/pos.js
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini POS">
<meta name="theme-color" content="#1c1b1a">
<title>Mini POS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pos.css">
<link rel="stylesheet" href="css/auth.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pos-theme') || 'light');</script>
<script src="js/auth.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1><a href="index.html" class="brand-link">Mini POS</a></h1>
    <div class="topbar-right">
      <button class="nav-toggle" id="navToggle" aria-label="เมนู"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      <nav class="nav">
        <a href="index.html" class="active">ขายสินค้า</a>
        <a href="products.html">จัดการสินค้า</a>
        <a href="orders.html">ประวัติการขาย</a>
        <a href="reports.html">รายงาน</a>
        <a href="settings.html">ตั้งค่าร้าน</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="สลับโหมดมืด/สว่าง"></button>
    </div>
  </header>

  <div class="main">
    <section class="pos-products">
      <div class="pos-search">
        <div id="ownerSelectWrap" class="owner-select-wrap hidden">
          <label for="ownerSelect">ขายแทน</label>
          <select id="ownerSelect"></select>
        </div>
        <input type="text" id="search" placeholder="ค้นหาสินค้า / Search products">
        <button class="btn btn-primary" id="scanCartBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 8V6a2 2 0 0 0-2-2h-2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><line x1="4" y1="12" x2="20" y2="12"/></svg><span>สแกนบาร์โค้ด</span></button>
      </div>
      <div id="categoryTabs" class="category-tabs hidden"></div>
      <div id="productGrid" class="product-grid scroll"></div>
    </section>

    <aside class="pos-cart card">
      <button class="cart-handle" id="cartHandle" aria-label="ขยาย/ย่อตะกร้าสินค้า">
        <span class="cart-handle-grip"></span>
        <span class="cart-handle-summary" id="cartHandleSummary">ยังไม่มีสินค้าในตะกร้า</span>
      </button>
      <div class="cart-header">
        <h2>ตะกร้าสินค้า</h2>
        <button class="btn btn-ghost" id="clearCart">ล้าง</button>
      </div>
      <div id="cartItems" class="cart-items scroll">
        <p class="empty-state">ยังไม่มีสินค้าในตะกร้า</p>
      </div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>ยอดรวม</span>
          <span id="cartTotal">฿0.00</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkoutBtn" disabled>ชำระเงิน</button>
      </div>
    </aside>
  </div>
</div>

<div class="modal-backdrop hidden" id="checkoutModal">
  <div class="modal">
    <h2>ชำระเงิน</h2>
    <p class="muted">ยอดที่ต้องชำระ</p>
    <p class="checkout-total" id="modalTotal">฿0.00</p>

    <div class="field">
      <label>ชื่อลูกค้า (ไม่บังคับ)</label>
      <input type="text" id="customerNameInput" placeholder="เช่น คุณสมชาย">
    </div>

    <div class="field">
      <label>รับเงินมา (บาท)</label>
      <input type="text" inputmode="none" id="receivedInput" readonly placeholder="0.00">
    </div>

    <div class="quick-cash">
      <button class="btn btn-primary quick-cash-btn" data-amount="exact">พอดี</button>
      <button class="btn quick-cash-btn" data-amount="5">5</button>
      <button class="btn quick-cash-btn" data-amount="10">10</button>
      <button class="btn quick-cash-btn" data-amount="50">50</button>
      <button class="btn quick-cash-btn" data-amount="100">100</button>
      <button class="btn quick-cash-btn" data-amount="500">500</button>
      <button class="btn quick-cash-btn" data-amount="1000">1000</button>
    </div>

    <div class="numpad" id="receivedNumpad">
      <button type="button" class="numpad-btn" data-key="1">1</button>
      <button type="button" class="numpad-btn" data-key="2">2</button>
      <button type="button" class="numpad-btn" data-key="3">3</button>
      <button type="button" class="numpad-btn" data-key="4">4</button>
      <button type="button" class="numpad-btn" data-key="5">5</button>
      <button type="button" class="numpad-btn" data-key="6">6</button>
      <button type="button" class="numpad-btn" data-key="7">7</button>
      <button type="button" class="numpad-btn" data-key="8">8</button>
      <button type="button" class="numpad-btn" data-key="9">9</button>
      <button type="button" class="numpad-btn" data-key=".">.</button>
      <button type="button" class="numpad-btn" data-key="0">0</button>
      <button type="button" class="numpad-btn numpad-btn-back" data-key="back" aria-label="ลบ">⌫</button>
    </div>

    <div class="change-row">
      <span>เงินทอน</span>
      <span id="changeAmount">฿0.00</span>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelCheckout">ยกเลิก</button>
      <button class="btn btn-primary" id="confirmCheckout">ยืนยันชำระเงิน</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="receiptModal">
  <div class="modal">
    <h2>ชำระเงินสำเร็จ</h2>
    <div id="receiptBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="printReceipt">พิมพ์ใบเสร็จ</button>
      <button class="btn btn-primary" id="closeReceipt">ขายต่อ</button>
    </div>
  </div>
</div>

<script src="vendor/html5-qrcode.min.js"></script>
<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/scanner.js"></script>
<script src="js/pos.js"></script>
</body>
</html>
