<!DOCTYPE html>
<html lang="th">
<!--
  ไฟล์นี้ทำหน้าที่: หน้าตั้งค่าเริ่มต้นระบบ สร้างบัญชีแอดมินคนแรกก่อนเริ่มใช้งาน
  จะแสดงเฉพาะตอนที่ระบบยังไม่มีผู้ใช้เลย ดูตรรกะได้ที่ js/setup.js
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini POS">
<meta name="theme-color" content="#1c1b1a">
<title>ตั้งค่าบัญชีแรก · Mini POS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pos-theme') || 'light');</script>
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <div class="auth-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l1-5h16l1 5"/><path d="M3 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M5 9v10h14V9"/><path d="M9 21v-6h6v6"/></svg></div>
    <h1>ยินดีต้อนรับ</h1>
    <p class="muted">สร้างบัญชีผู้ดูแลระบบบัญชีแรกก่อนเริ่มใช้งาน</p>

    <p class="auth-error" id="authError"></p>

    <form id="setupForm">
      <div class="field">
        <label>ชื่อผู้ใช้</label>
        <input type="text" id="fieldUsername" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="fieldPassword" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" id="fieldPasswordConfirm" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">สร้างบัญชี</button>
    </form>
  </div>
</div>

<script src="js/setup.js"></script>
</body>
</html>
