<!DOCTYPE html>
<html lang="th">
<!--
  ไฟล์นี้ทำหน้าที่: หน้าสมัครสมาชิกแบบเปิดสาธารณะ สร้างบัญชีร้านค้าใหม่ของตัวเอง
  (แยกจาก setup.html ซึ่งใช้ครั้งเดียวตอนยังไม่มีผู้ใช้เลยในระบบ) ดูตรรกะได้ที่ js/signup.js
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>สมัครสมาชิก · Mini POS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pos-theme') || 'light');</script>
</head>
<body>
<div class="auth-page">
  <div class="card auth-card">
    <h1>สมัครสมาชิก</h1>
    <p class="muted">สร้างบัญชีร้านค้าใหม่ของคุณ</p>

    <p class="auth-error" id="authError"></p>

    <form id="signupForm">
      <div class="field">
        <label>ชื่อผู้ใช้</label>
        <input type="text" id="fieldUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="fieldPassword" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" id="fieldPasswordConfirm" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">สมัครสมาชิก</button>
    </form>

    <p class="muted" style="text-align:center; margin:18px 0 0;">
      มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </p>
  </div>
</div>

<script src="js/signup.js"></script>
</body>
</html>
